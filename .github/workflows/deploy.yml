name: Deploy redirects to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js for tests
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare static site
        run: |
          mkdir -p _site/about _site/notes
          cp index.html 404.html about.html notes.html redirect.js _site/
          cp about.html _site/about/index.html
          cp notes.html _site/notes/index.html
          touch _site/.nojekyll

      - name: Test redirects and published files
        run: node --test tests/redirects.test.mjs
        env:
          SITE_DIR: _site

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
